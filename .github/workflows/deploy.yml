name: Deploy React App to AWS

on:
  push:
    branches: ["main"]

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test & Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        run: |
          docker --version
          docker info

      - name: Build Docker image (builder stage)
        run: docker build --target builder -t react-app-builder .

      - name: Run unit tests in Docker
        run: docker run --name react-container react-app-builder sh -c "npm ci && npm test -- --watchAll=false --ci"

      - name: Remove test container
        if: always()
        run: docker rm react-container || true

      - name: Run builder container
        run: docker run --name react-container react-app-builder sh -c "npm ci && npm run build"

      - name: Copy build folder out of container
        run: docker cp react-container:/app/build ./build

      - name: Remove build container
        if: always()
        run: docker rm react-container || true

      - name: Verify build folder exists
        run: |
          if [ ! -d "./build" ]; then
            echo "ERROR: ./build directory does not exist after Docker copy step."
            exit 1
          fi
          echo "Build folder verified:"
          ls ./build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-deploy-session

      - name: Upload build to S3
        run: aws s3 sync ./build s3://react-app-bucket-${{ secrets.AWS_ACCOUNT_ID }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
